name: Linux Steam monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: linux-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitor
        uses: actions/checkout@v4
        with:
          path: steam-monitor

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Unit tests
        run: python3 -m unittest discover -s steam-monitor/tests

      - name: Fetch client binaries
        id: fetch
        run: |
          PUBLISHED=$(python3 -c "import json; print(' '.join(json.load(open('steam-monitor/data/published.json')).get(v,{}).get('sha','') for v in json.load(open('steam-monitor/data/published.json'))))" 2>/dev/null || true)
          set +e
          python3 steam-monitor/tools/fetch_client.py --out steam-monitor/bins --channels stable beta --published-shas $PUBLISHED | tee fetch.log
          CODE=${PIPESTATUS[0]}
          set -e
          grep '^NEW ' fetch.log | tee steam-monitor/new_builds.txt || true
          if [ "$CODE" -eq 2 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; elif [ "$CODE" -ne 0 ]; then exit "$CODE"; fi

      - name: Verify patterns
        id: verify
        if: steps.fetch.outputs.skip != 'true'
        run: |
          : > fails.txt
          for channel in stable beta; do
            [ -f "steam-monitor/bins/$channel/steamclient.so" ] || continue
            set +e
            python3 steam-monitor/tools/check_patterns.py \
              --so "steam-monitor/bins/$channel/steamclient.so" > "check_$channel.log" 2>&1
            CODE=$?
            set -e
            cat "check_$channel.log"
            grep -E '^FAIL ' "check_$channel.log" >> fails.txt || true
            echo "$channel=$CODE" >> "$GITHUB_OUTPUT"
          done
          [ -s fails.txt ] && echo "failed=true" >> "$GITHUB_OUTPUT" || true

      - name: File issue on pattern mismatch
        if: steps.verify.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh issue list --search 'Patterns missing for new Steam build in:title' --state open --json number --jq length)" -eq 0 ]; then
            gh issue create --title "Patterns missing for new Steam build" \
              --body-file fails.txt || true
          else
            echo "open issue already exists, appending run log"
          fi

      - name: Publish verified builds
        if: steps.fetch.outputs.skip != 'true' && steps.verify.outputs.failed != 'true'
        run: |
          while read -r _ channel version sha; do
            [ -f "steam-monitor/bins/$channel/steamclient.so" ] || continue
            python3 steam-monitor/tools/publish.py --version "$version" --channel "$channel" --sha "$sha"
          done < steam-monitor/new_builds.txt
          rm -rf steam-monitor/bins steam-monitor/new_builds.txt
          git -C steam-monitor add data/
          git -C steam-monitor -c user.name="steam-monitor" -c user.email="steam-monitor@local" \
            commit -m "Add Steam build(s)" || true
          git -C steam-monitor push || true

      # GitHub silently disables cron schedules after 60 days without repo
      # activity. During quiet Steam periods this workflow commits nothing,
      # so push an empty heartbeat before the clock runs out.
      - name: Heartbeat keepalive
        if: steps.fetch.outputs.skip == 'true'
        run: |
          LAST=$(git -C steam-monitor log -1 --format=%ct)
          NOW=$(date +%s)
          if [ $(( (NOW - LAST) / 86400 )) -ge 50 ]; then
            git -C steam-monitor -c user.name="steam-monitor" -c user.email="steam-monitor@local" \
              commit --allow-empty -m "Heartbeat keepalive" || true
            git -C steam-monitor push || true
          fi
